    let currentFilteredQuotes = [...quotesData];
    let currentIndex = 0;
    let autoPlayInterval = null;
    let isAutoPlaying = false;
    let autoPlayTimer = 0;
    const AUTO_PLAY_DURATION = 5500;

    const quoteCard = document.getElementById('quoteCard');
    const charName = document.getElementById('charName');
    const charEmoji = document.getElementById('charEmoji');
    const quoteText = document.getElementById('quoteText');
    const quoteArc = document.getElementById('quoteArc');
    const quoteContext = document.getElementById('quoteContext');
    const quoteIndex = document.getElementById('quoteIndex');
    
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const randomBtn = document.getElementById('randomBtn');
    const copyBtn = document.getElementById('copyBtn');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const filterContainer = document.getElementById('filterContainer');

    const autoPlayBtn = document.getElementById('autoPlayBtn');
    const autoPlayIcon = document.getElementById('autoPlayIcon');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    function renderQuote(index) {
        if (!currentFilteredQuotes || currentFilteredQuotes.length === 0) return;
        
        if (index < 0) index = currentFilteredQuotes.length - 1;
        if (index >= currentFilteredQuotes.length) index = 0;
        currentIndex = index;

        const item = currentFilteredQuotes[currentIndex];

        quoteCard.classList.remove('quote-active');
        quoteCard.classList.add('quote-exit');

        setTimeout(() => {
            charName.textContent = item.character;
            charEmoji.textContent = item.emoji;
            quoteText.textContent = `「${item.quote}」`;
            quoteArc.textContent = item.arc;
            quoteContext.textContent = item.context;
            quoteIndex.textContent = `${currentIndex + 1} / ${currentFilteredQuotes.length}`;

            quoteCard.classList.remove('quote-exit');
            quoteCard.classList.add('quote-enter');

            void quoteCard.offsetWidth;

            quoteCard.classList.remove('quote-enter');
            quoteCard.classList.add('quote-active');
        }, 200);
    }

    function nextQuote() {
        if (currentFilteredQuotes.length === 0) return;
        const nextIdx = (currentIndex + 1) % currentFilteredQuotes.length;
        renderQuote(nextIdx);
        resetAutoPlayProgress();
    }

    function prevQuote() {
        if (currentFilteredQuotes.length === 0) return;
        const prevIdx = (currentIndex - 1 + currentFilteredQuotes.length) % currentFilteredQuotes.length;
        renderQuote(prevIdx);
        resetAutoPlayProgress();
    }

    function randomQuote() {
        if (currentFilteredQuotes.length <= 1) return;
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * currentFilteredQuotes.length);
        } while (randomIndex === currentIndex);
        
        renderQuote(randomIndex);
        resetAutoPlayProgress();
    }

    filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            filterBtns.forEach(b => {
                b.classList.remove('bg-sakura-500', 'text-white', 'shadow-md', 'shadow-sakura-500/30', 'font-bold');
                b.classList.add('text-slate-300', 'font-medium');
            });
            btn.classList.add('bg-sakura-500', 'text-white', 'shadow-md', 'shadow-sakura-500/30', 'font-bold');
            btn.classList.remove('text-slate-300', 'font-medium');

            const charFilter = btn.getAttribute('data-character');

            if (charFilter === 'ALL') {
                currentFilteredQuotes = [...quotesData];
            } else {
                currentFilteredQuotes = quotesData.filter(q => q.character === charFilter);
            }

            renderQuote(0);
            resetAutoPlayProgress();
        });
    });

    let isMouseDown = false;
    let startX, scrollLeftPos;

    filterContainer.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        startX = e.pageX - filterContainer.offsetLeft;
        scrollLeftPos = filterContainer.scrollLeft;
    });

    filterContainer.addEventListener('mouseleave', () => { isMouseDown = false; });
    filterContainer.addEventListener('mouseup', () => { isMouseDown = false; });

    filterContainer.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        e.preventDefault();
        const x = e.pageX - filterContainer.offsetLeft;
        const walk = (x - startX) * 1.8;
        filterContainer.scrollLeft = scrollLeftPos - walk;
    });

    filterContainer.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
            e.preventDefault();
            filterContainer.scrollLeft += e.deltaY;
        }
    }, { passive: false });

    copyBtn.addEventListener('click', () => {
        const item = currentFilteredQuotes[currentIndex];
        if (!item) return;
        
        const copyText = `「${item.quote}」—— ${item.character}《青春豬頭少年系列》`;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(copyText).then(() => {
                showToast("已成功複製台詞至剪貼簿！");
            }).catch(() => fallbackCopy(copyText));
        } else {
            fallbackCopy(copyText);
        }
    });

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            showToast("已成功複製台詞至剪貼簿！");
        } catch (err) {
            showToast("複製失敗，請手動複製", "fa-triangle-exclamation");
        }
        document.body.removeChild(textArea);
    }

    function showToast(msg, icon = "fa-circle-check") {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');

        toastMsg.textContent = msg;
        toastIcon.className = `fa-solid ${icon} text-sakura-400`;

        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');

        setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2200);
    }

    function startAutoPlay() {
        isAutoPlaying = true;
        autoPlayIcon.className = "fa-solid fa-pause text-sakura-400";
        autoPlayBtn.classList.add('border-sakura-400/50', 'bg-sakura-500/20');
        progressContainer.classList.remove('opacity-0');

        autoPlayTimer = 0;
        clearInterval(autoPlayInterval);

        autoPlayInterval = setInterval(() => {
            autoPlayTimer += 100;
            const progressPercent = (autoPlayTimer / AUTO_PLAY_DURATION) * 100;
            progressBar.style.width = `${progressPercent}%`;

            if (autoPlayTimer >= AUTO_PLAY_DURATION) {
                autoPlayTimer = 0;
                nextQuote();
            }
        }, 100);
    }

    function stopAutoPlay() {
        isAutoPlaying = false;
        autoPlayIcon.className = "fa-solid fa-play text-sakura-300";
        autoPlayBtn.classList.remove('border-sakura-400/50', 'bg-sakura-500/20');
        progressContainer.classList.add('opacity-0');
        progressBar.style.width = '0%';
        clearInterval(autoPlayInterval);
    }

    function resetAutoPlayProgress() {
        if (isAutoPlaying) {
            autoPlayTimer = 0;
            progressBar.style.width = '0%';
        }
    }

    autoPlayBtn.addEventListener('click', () => {
        if (isAutoPlaying) {
            stopAutoPlay();
        } else {
            startAutoPlay();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextQuote();
        if (e.key === 'ArrowLeft') prevQuote();
        if (e.key === ' ') {
            e.preventDefault();
            randomQuote();
        }
    });

    prevBtn.addEventListener('click', prevQuote);
    nextBtn.addEventListener('click', nextQuote);
    randomBtn.addEventListener('click', randomQuote);

    const bgmAudio = document.getElementById('bgmAudio');
    const bgmPlayBtn = document.getElementById('bgmPlayBtn');
    const bgmPlayIcon = document.getElementById('bgmPlayIcon');
    const bgmMuteBtn = document.getElementById('bgmMuteBtn');
    const bgmMuteIcon = document.getElementById('bgmMuteIcon');
    const bgmVolume = document.getElementById('bgmVolume');
    const eqContainer = document.getElementById('eqContainer');

    let isAudioPlaying = false;

    bgmPlayBtn.addEventListener('click', () => {
        if (isAudioPlaying) {
            bgmAudio.pause();
            bgmPlayIcon.className = "fa-solid fa-play text-sm ml-0.5";
            eqContainer.classList.add('opacity-0');
            isAudioPlaying = false;
        } else {
            bgmAudio.play().then(() => {
                bgmPlayIcon.className = "fa-solid fa-pause text-sm";
                eqContainer.classList.remove('opacity-0');
                isAudioPlaying = true;
            }).catch(() => {
                showToast("點擊微調音量即可開啓音訊體驗！", "fa-music");
            });
        }
    });

    bgmVolume.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        bgmAudio.volume = val;
        bgmAudio.muted = false;
        updateVolumeIcon(val);
    });

    bgmMuteBtn.addEventListener('click', () => {
        bgmAudio.muted = !bgmAudio.muted;
        if (bgmAudio.muted) {
            bgmMuteIcon.className = "fa-solid fa-volume-xmark text-[10px]";
        } else {
            updateVolumeIcon(bgmAudio.volume);
        }
    });

    function updateVolumeIcon(vol) {
        if (vol === 0 || bgmAudio.muted) {
            bgmMuteIcon.className = "fa-solid fa-volume-xmark text-[10px]";
        } else if (vol < 0.5) {
            bgmMuteIcon.className = "fa-solid fa-volume-low text-[10px]";
        } else {
            bgmMuteIcon.className = "fa-solid fa-volume-high text-[10px]";
        }
    }

    function initCanvasBackground() {
        const canvas = document.getElementById('bgCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = Array.from({ length: 70 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.4 + 0.4,
            alpha: Math.random(),
            speed: Math.random() * 0.008 + 0.003
        }));

        const petals = Array.from({ length: 26 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height - height,
            size: Math.random() * 6 + 4,
            speedY: Math.random() * 0.35 + 0.2,
            speedX: Math.random() * 0.25 - 0.125,
            angle: Math.random() * Math.PI * 2,
            angularSpeed: Math.random() * 0.01 - 0.005,
            color: Math.random() > 0.4 ? 'rgba(255, 183, 197, 0.6)' : 'rgba(255, 141, 161, 0.4)'
        }));

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.1) star.speed = -star.speed;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fill();
            });

            petals.forEach(petal => {
                petal.y += petal.speedY;
                petal.x += petal.speedX + Math.sin(petal.y * 0.008) * 0.35;
                petal.angle += petal.angularSpeed;

                if (petal.y > height + 20) {
                    petal.y = -20;
                    petal.x = Math.random() * width;
                }

                ctx.save();
                ctx.translate(petal.x, petal.y);
                ctx.rotate(petal.angle);
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-petal.size / 2, -petal.size, -petal.size, petal.size / 3, 0, petal.size);
                ctx.bezierCurveTo(petal.size, petal.size / 3, petal.size / 2, -petal.size, 0, 0);
                ctx.fillStyle = petal.color;
                ctx.fill();

                ctx.restore();
            });

            requestAnimationFrame(animateCanvas);
        }

        animateCanvas();
    }

    window.onload = function () {
        initCanvasBackground();
        renderQuote(0);
    };
</script>
